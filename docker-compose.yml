version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartfarm_app
    restart: always
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=smart_farm
      - DB_USERNAME=smartfarm
      - DB_PASSWORD=12345678
    depends_on:
      - db


  subscriber:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartfarm_subscriber
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan mqtt:subscribe-status
    volumes:
      - ./:/var/www
    depends_on:
      - db
      - mosquitto

  web:
    image: nginx:alpine
    container_name: smartfarm_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: smartfarm_db
    restart: always
    environment:
      MYSQL_DATABASE: smart_farm
      MYSQL_USER: smartfarm
      MYSQL_PASSWORD: 12345678
      MYSQL_ROOT_PASSWORD: 12345678
    volumes:
      - dbdata:/var/lib/mysql

  certbot:
    image: certbot/certbot
    container_name: smartfarm_certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: smartfarm_mqtt
    restart: unless-stopped
    volumes:
      - ./docker/mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    ports:
      - target: 1883
        published: "1883"
        host_ip: "10.33.109.67"
        protocol: tcp


volumes:
  dbdata:
  certbot-conf:
  certbot-www:
  mosquitto-data:
